id = "cursor"
name = "Cursor"
version = "0.1.0"
plugin_api = 1
repository = "https://github.com/computer-mcp/plugin-cursor"
description = "Cursor Agent CLI automation plus an ACP-to-MCP adapter."

[[dependencies]]
id = "cursor-agent"
commands = ["agent"]
instructions = "Install Cursor Agent separately and run agent login in the same Cursor Agent context selected for this plugin."
documentation = "https://cursor.com/docs/cli/reference/authentication"

[[dependencies]]
id = "python-runtime"
commands = ["python3"]
instructions = "Provide Python 3.13 or newer on the Computer MCP launch PATH. The plugin does not install Python."
documentation = "https://www.python.org/downloads/"

[[permissions]]
id = "project"
access = "write"
purpose = "Open Cursor sessions and run requested project tasks and edits in owner-selected worktrees, including cancellation and native response delivery."

[sandbox]
network = { level = "custom", hosts = ["api2.cursor.sh", "api5.cursor.sh"], include_trusted = false }
purpose = "Connect Cursor Agent to the official Cursor API and agent endpoints."

[[cli]]
id = "agent"
executable = { dependency = "cursor-agent" }
description = "Verified non-interactive Cursor Agent CLI surface."
tree = { kind = "file", path = "cli-tree.json" }

[[mcp]]
id = "acp"
transport = "stdio"
executable = { path = "bin/cursor-mcp-adapter" }
prefix = "cursor"
capabilities = ["tools", "resources"]
requirements = { project = "write" }
tool_requirements = { "cursor.acp.session.prompt.result" = { project = "read" }, "cursor.acp.session.list" = { project = "read" }, "cursor.acp.events.read" = { project = "read" }, "cursor.acp.requests.list" = { project = "read" } }

[mcp.vendor_execution]
dependency = "cursor-agent"
signature = "cursor-vendor-execution.json"

[mcp.vendor_execution.files]
"bin/cursor-mcp-adapter" = "3110f1cb6a203f3d2b2d8e7be8b7f8783ac30dd0215eac37b6d7928b353170ac"
"bin/cursor_vendor_execution.py" = "27478badaaf35e9c2499efdb4858ebeae048e7117b7d07377452b5d7e52bd2b3"
"bin/plugin_runtime.py" = "5a9f797bfca4b6ab31a9a648017fb1d09400593a9aab0d2250d426efa51f97cf"
"cli-tree.json" = "cc52c0bc7662f93d8596f715625d2ed274d05d95c681bac4d32c0faf273b64a3"
"cursor-vendor-execution.json" = "b50a088d4db85f42f2c4b9bd78fd26ee8b84e3009bdec0867beb60df2c738d2f"

[[skills]]
id = "cursor-agent"
path = "skills/cursor-agent"
description = "Guidance for choosing Cursor CLI and ACP-backed tools safely."

[compatibility]
minimum_host = "0.1.0"
architectures = ["arm64"]
